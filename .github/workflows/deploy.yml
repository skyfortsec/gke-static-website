name: Deploy to GKE

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Terraform Deploy to GKE
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Auth FIRST so gcloud/terraform use the right identity
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v1
        with:
          project_id: ${{ vars.GCP_PROJECT }}
          install_components: gke-gcloud-auth-plugin

      # Optional but very useful for troubleshooting (keep it for now)
      - name: Verify identity and project
        run: |
          gcloud auth list
          gcloud config set project "${{ vars.GCP_PROJECT }}"
          gcloud config list project

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      - name: Terraform Init
        working-directory: ./terraform
        run: terraform init

      - name: Terraform Apply
        working-directory: ./terraform
        run: |
          terraform apply -auto-approve \
            -var="project_id=${{ vars.GCP_PROJECT }}" \
            -var="region=${{ vars.GKE_REGION }}" \
            -var="zone=${{ vars.GCP_ZONE }}" \
            -var="cluster_name=${{ vars.GKE_CLUSTER_NAME }}"
